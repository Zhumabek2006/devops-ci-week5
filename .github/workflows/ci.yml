name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the code; it needs no write access and no secrets.
permissions:
  contents: read

# A new push to the same branch cancels the older, still running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Check code style and common bugs
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest --junitxml=test-results/junit-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()          # upload the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 14

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devops/week5:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 devops/week5:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8000/healthz
          echo
          echo "runs as: $(docker exec smoke id)"
          docker rm -f smoke

      - name: Record image digest
        run: |
          {
            echo "image=devops/week5:ci"
            echo "image_id=${{ steps.build.outputs.imageid }}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "commit=${{ github.sha }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > image-digest.txt
          cat image-digest.txt

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 14
